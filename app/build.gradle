plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cs663.activerec'
    compileSdk 34

    defaultConfig {
        applicationId "com.cs663.activerec"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep .tflite files uncompressed so they can be memory-mapped from assets
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    // Align all Kotlin stdlib pieces to one version (fixes "Duplicate class kotlin...jdk8" build error)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'

    // TensorFlow Lite / LiteRT runtime (org.tensorflow.lite.Interpreter).
    // Our models only use basic built-in ops, so any recent version works.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    // CameraX for live camera mode
    def camerax_version = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ListenableFuture type used by ProcessCameraProvider.getInstance() from Java
    implementation 'com.google.guava:listenablefuture:1.0'
}
